<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch-Quiz: Die Bedeutung von пара</title>
    <style>
        :root {
            --primary-color: #2b6cb0;
            --bg-color: #f7fafc;
            --card-de-color: #edf2f7;
            --card-ru-color: #feebc8;
            --success-color: #48bb78;
            --text-color: #2d3748;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .quiz-container {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--primary-color);
            text-align: center;
        }

        p.instruction {
            margin-bottom: 25px;
            text-align: center;
            color: #4a5568;
            font-size: 1.05rem;
        }

        .game-board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 600px) {
            .game-board {
                grid-template-columns: 1fr;
                gap: 25px;
            }
            
            .column-header {
                display: none;
            }
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .column-header {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card {
            width: 100%;
            max-width: 280px;
            padding: 18px;
            background-color: var(--card-de-color);
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            text-align: center;
            font-size: 1.1rem;
            cursor: grab;
            user-select: none;
            transition: all 0.2s ease;
            position: relative;
            touch-action: none; /* Verhindert Scrollen beim Ziehen auf Mobile */
        }

        .card:active {
            cursor: grabbing;
        }

        .card.russian {
            background-color: var(--card-ru-color);
            border-color: #fbd38d;
            font-weight: bold;
            font-size: 1.25rem;
            cursor: default;
        }

        /* Status-Styling */
        .card.selected {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5);
            transform: scale(1.02);
        }

        .card.matched {
            background-color: var(--success-color) !important;
            border-color: #38a169 !important;
            color: white;
            cursor: default;
            transform: none;
            box-shadow: none;
        }

        .feedback {
            text-align: center;
            min-height: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 15px;
        }

        .reset-btn {
            display: block;
            margin: 20px auto 0 auto;
            padding: 12px 24px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            display: none;
        }

        .reset-btn:hover {
            background-color: #2b6cb0;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Wortbedeutung von пара</h1>
    <p class="instruction">Ziehe die deutsche Bedeutung auf das passende russische Wort oder klicke beide nacheinander an.</p>

    <div class="game-board">
        <div class="column" id="german-column">
            <div class="column-header">Deutsch</div>
            <!-- Karten werden per JS gemischt eingefügt -->
        </div>
        <div class="column" id="russian-column">
            <div class="column-header">Russisch</div>
            <!-- Karten werden per JS eingefügt -->
        </div>
    </div>

    <div class="feedback" id="feedback-field"></div>
    <button class="reset-btn" id="reset-button" onclick="initQuiz()">Nochmal spielen</button>
</div>

<script>
    // Datenstruktur für die Kärtchen
    const quizData = [
        { id: "1", de: "eine Doppelstunde (Uni)", ru: "пара", matchGroup: "group_para" },
        { id: "2", de: "ein Paar (z. B. Schuhe)", ru: "пара", matchGroup: "group_para" },
        { id: "3", de: "ein Student", ru: "студент", matchGroup: "group_student" },
        { id: "4", de: "morgen", ru: "завтра", matchGroup: "group_tomorrow" }
    ];

    let selectedGermanCard = null;
    let draggedElement = null;

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function initQuiz() {
        const germanColumn = document.getElementById("german-column");
        const russianColumn = document.getElementById("russian-column");
        const feedbackField = document.getElementById("feedback-field");
        const resetBtn = document.getElementById("reset-button");

        // Zurücksetzen
        feedbackField.textContent = "";
        feedbackField.style.color = "initial";
        resetBtn.style.display = "none";
        selectedGermanCard = null;

        // Header erhalten, Rest löschen
        germanColumn.innerHTML = '<div class="column-header">Deutsch</div>';
        russianColumn.innerHTML = '<div class="column-header">Russisch</div>';

        // Deutsche Karten mischen
        const shuffledDe = shuffle([...quizData]);
        shuffledDe.forEach(item => {
            const card = document.createElement("div");
            card.classList.add("card");
            card.textContent = item.de;
            card.dataset.id = item.id;
            card.dataset.group = item.matchGroup;
            card.setAttribute("draggable", "true");
            
            // Event Listener für Desktop & Mobile
            card.addEventListener("click", handleGermanClick);
            card.addEventListener("dragstart", handleDragStart);
            card.addEventListener("dragend", handleDragEnd);
            card.addEventListener("touchstart", handleTouchStart, { passive: false });
            card.addEventListener("touchmove", handleTouchMove, { passive: false });
            card.addEventListener("touchend", handleTouchEnd);

            germanColumn.appendChild(card);
        });

        // Russische Karten generieren (Einzigartige Werte für Zielkarten)
        // Da "пара" doppelt vorkommt, filtern wir nach einzigartigen russischen Begriffen
        const uniqueRu = [];
        const map = new Map();
        for (const item of quizData) {
            if(!map.has(item.ru)){
                map.set(item.ru, true);
                uniqueRu.push(item);
            }
        }
        
        shuffle(uniqueRu).forEach(item => {
            const card = document.createElement("div");
            card.classList.add("card", "russian");
            card.textContent = item.ru;
            card.dataset.group = item.matchGroup;
            
            card.addEventListener("click", handleRussianClick);
            card.addEventListener("dragover", handleDragOver);
            card.addEventListener("drop", handleDrop);

            russianColumn.appendChild(card);
        });
    }

    // CLICK-STEUERUNG (Ideal für Mobile & Barrierefreiheit)
    function handleGermanClick(e) {
        if (e.target.classList.contains("matched")) return;

        if (selectedGermanCard) {
            selectedGermanCard.classList.remove("selected");
        }
        
        selectedGermanCard = e.target;
        selectedGermanCard.classList.add("selected");
    }

    function handleRussianClick(e) {
        if (!selectedGermanCard || e.target.classList.contains("matched")) return;

        checkMatch(selectedGermanCard, e.target);
    }

    // NATIVES DRAG AND DROP (Desktop)
    function handleDragStart(e) {
        if (e.target.classList.contains("matched")) {
            e.preventDefault();
            return;
        }
        draggedElement = e.target;
        e.target.classList.add("selected");
        e.dataTransfer.setData("text/plain", e.target.dataset.id);
    }

    function handleDragEnd(e) {
        e.target.classList.remove("selected");
    }

    function handleDragOver(e) {
        e.preventDefault();
    }

    function handleDrop(e) {
        e.preventDefault();
        if (!draggedElement) return;
        checkMatch(draggedElement, e.currentTarget);
        draggedElement = null;
    }

    // TOUCH-STEUERUNG (Für flüssiges Ziehen auf Smartphones)
    let touchStartX = 0;
    let touchStartY = 0;

    function handleTouchStart(e) {
        if (e.target.classList.contains("matched")) return;
        draggedElement = e.target;
        draggedElement.classList.add("selected");
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
    }

    function handleTouchMove(e) {
        if (!draggedElement) return;
        e.preventDefault(); // Verhindert das Scrollen der Seite beim Ziehen
        const touch = e.touches[0];
        
        // Temporäre visuelle Verschiebung des Elements
        draggedElement.style.position = 'fixed';
        draggedElement.style.left = `${touch.clientX - (draggedElement.offsetWidth / 2)}px`;
        draggedElement.style.top = `${touch.clientY - (draggedElement.offsetHeight / 2)}px`;
        draggedElement.style.zIndex = '1000';
    }

    function handleTouchEnd(e) {
        if (!draggedElement) return;
        
        // Styles zurücksetzen
        draggedElement.style.position = '';
        draggedElement.style.left = '';
        draggedElement.style.top = '';
        draggedElement.style.zIndex = '';
        draggedElement.classList.remove("selected");

        const touch = e.changedTouches[0];
        // Element unter dem Finger ermitteln
        const elementUnderFinger = document.elementFromPoint(touch.clientX, touch.clientY);
        
        if (elementUnderFinger) {
            const russianCard = elementUnderFinger.closest('.card.russian');
            if (russianCard) {
                checkMatch(draggedElement, russianCard);
            }
        }
        draggedElement = null;
    }

    // LOGIK-PRÜFUNG
    function checkMatch(germanCard, russianCard) {
        const feedbackField = document.getElementById("feedback-field");
        
        // Spezialfall "para": Beide deutschen Karten teilen sich dieselbe russische Zielgruppe
        const isParaMatch = (germanCard.dataset.group === "group_para" && russianCard.textContent === "пара");
        const isStandardMatch = (germanCard.dataset.group === russianCard.dataset.group);

        if (isParaMatch || isStandardMatch) {
            // Treffer!
            germanCard.classList.add("matched");
            germanCard.classList.remove("selected");
            germanCard.setAttribute("draggable", "false");
            
            // Falls alle Karten für dieses russische Wort gefunden wurden, färbe es grün
            checkRussianCardCompletion(russianCard);

            feedbackField.textContent = "Правильно! (Richtig!)";
            feedbackField.style.color = "var(--success-color)";
            selectedGermanCard = null;

            checkGameEnd();
        } else {
            // Fehler
            feedbackField.textContent = "Versuche es noch einmal!";
            feedbackField.style.color = "#e53e3e";
            germanCard.classList.remove("selected");
            selectedGermanCard = null;
        }
    }

    function checkRussianCardCompletion(russianCard) {
        const word = russianCard.textContent;
        // Zähle, wie viele deutsche Karten zu diesem Wort gehören
        const totalRequired = quizData.filter(item => item.ru === word).length;
        // Zähle, wie viele davon bereits den Status 'matched' haben
        const currentMatched = Array.from(document.querySelectorAll('.column#german-column .card.matched'))
            .filter(card => {
                const dataItem = quizData.find(d => d.id === card.dataset.id);
                return dataItem && dataItem.ru === word;
            }).length;

        if (totalRequired === currentMatched) {
            russianCard.classList.add("matched");
        }
    }

    function checkGameEnd() {
        const totalCards = document.querySelectorAll('.column#german-column .card').length;
        const matchedCards = document.querySelectorAll('.column#german-column .card.matched').length;

        if (totalCards === matchedCards) {
            const feedbackField = document.getElementById("feedback-field");
            feedbackField.textContent = "Ausgezeichnet! Du hast gelernt, dass пара sowohl ein Paar als auch eine Doppelstunde heißen kann.";
            feedbackField.style.color = "var(--primary-color)";
            document.getElementById("reset-button").style.display = "block";
        }
    }

    // Spiel beim Laden der Seite starten
    window.onload = initQuiz;
</script>

</body>
</html>
