<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch-Quiz: Audio-Inseln</title>
    <style>
        :root {
            --primary-color: #2b6cb0;
            --primary-hover: #1a528d;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #cbd5e0;
            --success-color: #38a169;
            --success-bg: #f0fff4;
            --error-color: #e53e3e;
            --error-bg: #fff5f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: #edf2f7;
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 16.66%;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: var(--primary-color);
            text-align: center;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #718096;
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .audio-island {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #edf2f7;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        .play-btn {
            width: 70px;
            height: 70px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(43, 108, 176, 0.3);
            padding-left: 5px;
        }

        .play-btn:hover {
            background-color: var(--primary-hover);
            transform: scale(1.05);
        }

        .audio-label {
            margin-top: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #4a5568;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            width: 100%;
            padding: 15px;
            text-align: left;
            background: #fff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.15s ease;
            font-weight: 500;
        }

        @media (hover: hover) {
            .option-btn:hover:not(:disabled) {
                border-color: var(--primary-color);
                background-color: #f7fafc;
            }
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            border-color: var(--success-color);
            background-color: var(--success-bg);
            color: #22543d;
        }

        .option-btn.wrong {
            border-color: var(--error-color);
            background-color: var(--error-bg);
            color: #742a2a;
        }

        .feedback-box {
            display: none;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            margin-top: 15px;
        }

        .action-btn {
            display: none;
            margin: 20px auto 0 auto;
            padding: 12px 30px;
            color: white;
            background-color: var(--primary-color);
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background-color: var(--primary-hover);
        }

        @media (max-width: 480px) {
            .quiz-container { padding: 20px; }
            h1 { font-size: 1.3rem; }
            .option-btn { padding: 12px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="progress-bar-container">
        <div class="progress-bar" id="progress"></div>
    </div>
    
    <h1 id="quiz-title">Audio-Inseln (Satz 1 von 6)</h1>
    <div class="subtitle">Hören und Zuordnen</div>

    <div class="audio-island">
        <button class="play-btn" onclick="playAudio()">▶</button>
        <div class="audio-label">Satz anhören</div>
    </div>

    <div class="options-list" id="options-container">
        </div>

    <div class="feedback-box" id="feedback-box"></div>

    <button class="action-btn" id="action-button" onclick="handleActionClick()"></button>
</div>

<script>
    const questions = [
        {
            russianText: "Привет, знаете ли вы, что такое пара?",
            options: [
                "Hallo, wissen Sie, was eine Doppelstunde (para) ist?",
                "Hallo, habt ihr heute auch zwei Unterrichtsstunden?",
                "Guten Tag, wer weiß, wo der Hörsaal ist?"
            ],
            correctIndex: 0,
            explanation: "Richtig! „Привет“ heißt Hallo und „знаете ли вы“ bedeutet wissen Sie."
        },
        {
            russianText: "У этого слова есть несколько значений.",
            options: [
                "Dieses Wort wird an Universitäten selten benutzt.",
                "Dieses Wort hat mehrere verschiedene Bedeutungen.",
                "Zu diesem Wort gibt es keine passende Übersetzung."
            ],
            correctIndex: 1,
            explanation: "Exzellent! „несколько значений“ bedeutet mehrere Bedeutungen."
        },
        {
            russianText: "пара — это занятие в университете.",
            options: [
                "Ein Paar Schuhe braucht man für den Universitätssport.",
                "Eine Lehrveranstaltung findet immer im Universitätshof statt.",
                "Eine „Para“ ist eine Lehrveranstaltung an der Universität."
            ],
            correctIndex: 2,
            explanation: "Stimmt genau! „занятие в университете“ bedeutet Lehrveranstaltung/Unterricht an der Uni."
        },
        {
            russianText: "Завтра у меня не будет пар",
            options: [
                "Morgen muss ich fünf Doppelstunden besuchen.",
                "Morgen habe ich keine Vorlesungen (ich habe frei).",
                "Gestern hatte ich keine Uni-Veranstaltungen."
            ],
            correctIndex: 1,
            explanation: "Richtig! „не будет пар“ verneint das Vorhandensein von Lehrveranstaltungen. Der Student hat morgen frei."
        },
        {
            russianText: "Сегодня у нас будет пять пар",
            options: [
                "Heute werden wir fünf Doppelstunden haben.",
                "Heute fällt die fünfte Vorlesung leider aus.",
                "Morgen haben wir fünf Stunden Unterricht."
            ],
            correctIndex: 0,
            explanation: "Ausgezeichnet! „пять пар“ bedeutet übersetzt fünf Doppelstunden (also ein sehr langer Unitag)."
        },
        {
            russianText: "Напишите ваш пример с этим словом в комментариях.",
            options: [
                "Lest euch die Beispiele mit diesem Wort in den Kommentaren durch.",
                "Schreiben Sie Ihr Beispiel mit diesem Wort in die Kommentare.",
                "Merken Sie sich dieses Wort für die nächste Prüfung vor."
            ],
            correctIndex: 1,
            explanation: "Klasse! „Напишите ваш пример“ fordert dazu auf, ein eigenes Beispiel aufzuschreiben."
        }
    ];

    let currentIndex = 0;

    function loadQuestion() {
        const q = questions[currentIndex];

        // UI Updates
        document.getElementById("quiz-title").textContent = `Audio-Inseln (Satz ${currentIndex + 1} von ${questions.length})`;
        document.getElementById("progress").style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
        document.getElementById("feedback-box").style.display = "none";
        document.getElementById("action-button").style.display = "none";

        // Optionen rendern
        const container = document.getElementById("options-container");
        container.innerHTML = "";

        q.options.forEach((optionText, index) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.textContent = optionText;
            btn.onclick = () => handleAnswerSelection(index, btn);
            container.appendChild(btn);
        });

        // Kurze Verzögerung für automatische Sprachausgabe, falls vom Browser erlaubt
        setTimeout(() => { playAudio(); }, 300);
    }

    function playAudio() {
        const text = questions[currentIndex].russianText;
        
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Vorherige Audio-Ausgaben stoppen

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.rate = 0.82; // Leicht verlangsamt für optimales Schüler-Verständnis

            window.speechSynthesis.speak(utterance);
        } else {
            alert("Die Sprachausgabe (Text-to-Speech) wird von deinem Browser leider nicht unterstützt.");
        }
    }

    function handleAnswerSelection(selectedIndex, clickedButton) {
        const q = questions[currentIndex];
        const buttons = document.querySelectorAll(".option-btn");
        const feedback = document.getElementById("feedback-box");

        buttons.forEach(btn => btn.disabled = true);

        if (selectedIndex === q.correctIndex) {
            clickedButton.classList.add("correct");
            feedback.style.backgroundColor = "var(--success-bg)";
            feedback.style.border = "1px solid var(--success-color)";
            feedback.style.color = "#22543d";
            feedback.innerHTML = `🎉 <strong>Richtig!</strong><br><small>${q.explanation}</small>`;
        } else {
            clickedButton.classList.add("wrong");
            buttons[q.correctIndex].classList.add("correct");
            
            feedback.style.backgroundColor = "var(--error-bg)";
            feedback.style.border = "1px solid var(--error-color)";
            feedback.style.color = "#742a2a";
            feedback.innerHTML = `❌ <strong>Leider falsch!</strong><br><small>Klicke oben auf das Play-Symbol und höre noch mal genau hin.</small>`;
        }
        
        feedback.style.display = "block";

        const actionBtn = document.getElementById("action-button");
        if (currentIndex < questions.length - 1) {
            actionBtn.textContent = "Nächster Satz";
        } else {
            actionBtn.textContent = "Quiz abschließen";
        }
        actionBtn.style.display = "block";
    }

    function handleActionClick() {
        const actionBtn = document.getElementById("action-button");
        const mode = actionBtn.textContent;

        if (mode === "Nächster Satz") {
            currentIndex++;
            loadQuestion();
        } else if (mode === "Quiz abschließen") {
            // Endbildschirm anzeigen
            document.getElementById("progress").style.width = "100%";
            document.getElementById("quiz-title").textContent = "Quiz beendet!";
            document.getElementById("options-container").innerHTML = "";
            document.getElementById("feedback-box").style.display = "none";
            
            const audioIsland = document.querySelector(".audio-island");
            audioIsland.innerHTML = "🏆";
            audioIsland.style.fontSize = "3rem";

            actionBtn.textContent = "Quiz neustarten";
            actionBtn.style.display = "block";
        } else if (mode === "Quiz neustarten") {
            // Vollständiger Reset zurück zu Satz 1
            currentIndex = 0;
            const audioIsland = document.querySelector(".audio-island");
            audioIsland.innerHTML = '<button class="play-btn" onclick="playAudio()">▶</button><div class="audio-label">Satz anhören</div>';
            audioIsland.style.fontSize = "initial";
            loadQuestion();
        }
    }

    window.onload = loadQuestion;
</script>

</body>
</html>
